<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact White Water Rafting FGY for reservation questions, general inquiries, and website suggestions.">
    <meta name="author" content="Fabiana Gonzalez Yanes">
    <title>Contact Us - White Water Rafting FGY</title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>

        <img src="images/z-wwr-oars.png" alt="White Water Rafting Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>

    </header>

    <main>
        <section class="contact-info">
            <h1>Contact Us</h1>

            <div class="company-details">
                <h2>White Water Rafting FGY</h2>
                <p><strong>Address:</strong> Bogotá, Colombia</p>
                <p><strong>Phone:</strong> +57 300 000 0000</p>
                <p><strong>Email:</strong> info@raftingfgy.com</p>
            </div>
            <div class="company-map">
                <iframe src="https://maps.google.com/maps?q=Bogota%2C%20Colombia&output=embed"
                  title="Map showing White Water Rafting FGY location" width="100%" height="300"
                  loading="lazy">
                </iframe>
            </div>
        </section>

        <section class="employees">
            <h2>Meet Our Team</h2>
            <figure>
                <img src="images/employeeone.jpg" alt="Rafting team member">
                <figcaption>River Guide - Carlos</figcaption>
            </figure>

            <figure>
                <img src="images/rafting19.jpg" alt="Safety manager">
                <figcaption>Safety Manager - Rafael</figcaption>
            </figure>

            <figure>
                <img src="images/rafting18.jpg" alt="Customer service representative">
                <figcaption>Customer Service - William</figcaption>
            </figure>

        </section>

        <section class="contact-form">
            <h2>Send Us a Message</h2>

            <form action="#" method="post">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>

                <fieldset>
                    <legend>Purpose of Message:</legend>

                    <label>
                        <input type="radio" name="purpose" value="general" required>
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="website">
                        Website Suggestion
                    </label>
                </fieldset>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <label for="subscribe">
                    <input type="checkbox" id="subscribe" name="subscribe">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Send Message</button>
            </form>
        </section>

    </main>

    <footer>

        <p>
            &copy; 2026 White Water Rafting FGY | Fabiana Gonzalez Yanes
        </p>

        <nav class="socialmedia">

            <a href="https://facebook.com">
                <img src="images/facebook.jpg" alt="Facebook Icon">
            </a>

            <a href="https://twitter.com">
                <img src="images/twitter.png" alt="Twitter Icon">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.jpg" alt="Instagram Icon">
            </a>

        </nav>
    </footer>

</body>

</html>
